<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lernwelt</title>
<style>
  :root{
    --paper:#F5F7F6;
    --card:#FFFFFF;
    --ink:#2B2D5B;
    --ink-soft:#6C6F97;
    --mathe:#2FA6B8;
    --deutsch:#EF7D57;
    --sach:#5FB07A;
    --text:#8B6FCF;
    --star:#FBC02D;
    --good:#4CAF6E;
    --oops:#E86A6A;
    --accent:var(--mathe);
    --shadow:0 10px 24px rgba(43,45,91,.12);
    --shadow-sm:0 4px 12px rgba(43,45,91,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"ui-rounded","SF Pro Rounded",system-ui,-apple-system,"Segoe UI Rounded","Nunito",sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:22px 18px 32px;}

  /* ---------- HOME ---------- */
  .home-head{text-align:center;margin:14px 0 26px;}
  .home-head .hi{font-size:15px;color:var(--ink-soft);font-weight:600;letter-spacing:.3px;}
  .home-head h1{font-size:38px;margin:6px 0 0;font-weight:800;letter-spacing:-.5px;}
  .home-head .sub{font-size:15px;color:var(--ink-soft);margin-top:6px;}

  .lang-toggle{display:flex;justify-content:center;gap:8px;margin-bottom:4px;}
  .lang-btn{
    border:none;cursor:pointer;background:var(--card);color:var(--ink-soft);
    border-radius:14px;padding:8px 16px;font-size:14px;font-weight:800;box-shadow:var(--shadow-sm);
    transition:background .15s,color .15s;
  }
  .lang-btn.active{background:var(--mathe);color:#fff;}
  .lang-btn:active{transform:scale(.95);}

  .cards{display:flex;flex-direction:column;gap:16px;margin-top:6px;}
  .card{
    border:none;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border-radius:26px;padding:22px 22px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;
    transition:transform .12s ease, box-shadow .12s ease;
    border-bottom:6px solid var(--c);
  }
  .card:active{transform:translateY(2px) scale(.99);}
  .card .emoji{
    width:64px;height:64px;flex:0 0 64px;border-radius:20px;
    display:grid;place-items:center;font-size:34px;
    background:color-mix(in srgb, var(--c) 16%, white);
  }
  .card .txt h2{margin:0;font-size:23px;font-weight:800;}
  .card .txt p{margin:3px 0 0;font-size:14px;color:var(--ink-soft);}
  .card .go{margin-left:auto;font-size:26px;color:var(--c);font-weight:800;}

  .foot{margin-top:auto;text-align:center;font-size:12.5px;color:var(--ink-soft);padding-top:26px;}

  .hist-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:18px auto 0;background:var(--card);border:none;cursor:pointer;
    border-radius:16px;padding:12px 18px;font-size:14px;font-weight:700;color:var(--ink-soft);
    box-shadow:var(--shadow-sm);
  }
  .hist-btn:active{transform:scale(.97);}

  .hist-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .hist-item{
    background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow-sm);
    border-left:5px solid var(--mathe);
  }
  .hist-item .d{font-size:12.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .hist-item .t{font-size:16px;font-weight:700;margin-top:4px;line-height:1.35;}

  /* ---------- STORY (Mehrschritt-Geschichten) ---------- */
  .story-card{
    background:var(--card);border-radius:28px;box-shadow:var(--shadow);
    padding:26px 22px;margin-bottom:20px;
  }
  .story-emoji{font-size:40px;text-align:center;display:block;margin-bottom:6px;}
  .story-title{font-size:19px;font-weight:800;text-align:center;color:var(--accent);margin-bottom:14px;}
  .story-text{font-size:17px;line-height:1.55;color:var(--ink);}
  .story-text b{color:var(--accent);font-weight:800;}

  .steps{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .step{
    background:color-mix(in srgb, var(--accent) 7%, white);
    border-radius:18px;padding:14px 16px;
    border:2.5px solid transparent;transition:border-color .15s,opacity .2s;
  }
  .step.locked{opacity:.45;}
  .step .slabel{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;}
  .step .stext{font-size:15.5px;font-weight:600;margin:4px 0 10px;color:var(--ink);}
  .step .srow{display:flex;gap:10px;align-items:center;}
  .step input{
    flex:1;border:none;border-radius:12px;padding:12px 14px;font-size:20px;font-weight:800;
    background:#fff;box-shadow:inset 0 0 0 2px #e6e8ee;color:var(--ink);text-align:center;
    -webkit-appearance:none;
  }
  .step input:focus{outline:none;box-shadow:inset 0 0 0 2.5px var(--accent);}
  .step button.chk{
    border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;
    font-size:16px;padding:12px 18px;cursor:pointer;
  }
  .step button.chk:active{transform:scale(.95);}
  .step.correct{border-color:var(--good);}
  .step.wrong input{box-shadow:inset 0 0 0 2.5px var(--oops);}
  .step .stepfb{font-size:13.5px;font-weight:700;margin-top:8px;display:none;}
  .step .stepfb.show{display:block;}
  .step .stepfb.ok{color:#2f7a4e;}
  .step .stepfb.no{color:#b64545;}

  /* ---------- QUIZ ---------- */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .back{
    border:none;background:var(--card);box-shadow:var(--shadow-sm);
    width:46px;height:46px;border-radius:16px;font-size:22px;color:var(--ink);
    cursor:pointer;flex:0 0 46px;
  }
  .back:active{transform:scale(.94);}
  .top .name{font-size:19px;font-weight:800;color:var(--accent);}
  .stars{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;}
  .stars .s{font-size:20px;}

  .dots{display:flex;gap:7px;margin:6px 2px 20px;}
  .dots i{height:8px;border-radius:4px;flex:1;background:color-mix(in srgb, var(--accent) 22%, #e6e8ee);transition:background .2s;}
  .dots i.done{background:var(--accent);}
  .dots i.now{background:color-mix(in srgb, var(--accent) 60%, white);}

  .q-card{
    background:var(--card);border-radius:28px;box-shadow:var(--shadow);
    padding:30px 24px;text-align:center;margin-bottom:20px;
  }
  .q-label{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);}
  .q-text{font-size:30px;font-weight:800;line-height:1.25;margin:12px 0 0;}
  .q-text.small{font-size:24px;}

  /* answers */
  .opts{display:flex;flex-direction:column;gap:13px;}
  .opt{
    border:none;cursor:pointer;background:var(--card);
    border-radius:20px;padding:19px 20px;font-size:21px;font-weight:700;color:var(--ink);
    box-shadow:var(--shadow-sm);text-align:left;
    border:2.5px solid transparent;transition:transform .1s, border-color .15s, background .15s;
  }
  .opt:active{transform:scale(.985);}
  .opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,white);}
  .opt.wrong{border-color:var(--oops);background:color-mix(in srgb,var(--oops) 12%,white);}
  .opt.dim{opacity:.5;}

  /* number pad */
  .display{
    background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm);
    min-height:66px;display:grid;place-items:center;font-size:34px;font-weight:800;
    margin-bottom:14px;letter-spacing:2px;color:var(--accent);
    border:2.5px solid transparent;transition:border-color .15s,background .15s;
  }
  .display.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,white);color:var(--good);}
  .display.wrong{border-color:var(--oops);background:color-mix(in srgb,var(--oops) 12%,white);color:var(--oops);}
  .display .ph{color:#c3c6d4;}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
  .key{
    border:none;cursor:pointer;background:var(--card);box-shadow:var(--shadow-sm);
    border-radius:18px;height:62px;font-size:26px;font-weight:800;color:var(--ink);
  }
  .key:active{transform:scale(.95);}
  .key.act{background:var(--accent);color:#fff;grid-column:span 1;}
  .key.wide{grid-column:span 1;}

  /* feedback banner + explanation */
  .fb{
    margin-top:16px;border-radius:18px;padding:15px 18px;font-size:16px;font-weight:700;
    display:none;align-items:flex-start;gap:10px;line-height:1.35;
  }
  .fb.show{display:flex;animation:pop .25s ease;}
  .fb.ok{background:color-mix(in srgb,var(--good) 14%,white);color:#2f7a4e;}
  .fb.no{background:color-mix(in srgb,var(--oops) 14%,white);color:#b64545;}
  .fb .big{font-size:22px;line-height:1;}
  .fb .why{font-weight:600;color:var(--ink);display:block;margin-top:5px;}

  .next{
    margin-top:16px;width:100%;border:none;cursor:pointer;
    background:var(--accent);color:#fff;border-radius:20px;padding:18px;
    font-size:19px;font-weight:800;box-shadow:var(--shadow-sm);display:none;
  }
  .next.show{display:block;}
  .next:active{transform:scale(.99);}

  /* ---------- DONE ---------- */
  .done{text-align:center;margin-top:40px;}
  .done .burst{font-size:76px;animation:bounce 1s ease;}
  .done h2{font-size:30px;font-weight:800;margin:10px 0 4px;}
  .done p{font-size:17px;color:var(--ink-soft);margin:0 0 8px;}
  .done .tally{font-size:22px;font-weight:800;color:var(--star);margin:10px 0 24px;}
  .done .row{display:flex;gap:12px;}
  .done .row button{
    flex:1;border:none;cursor:pointer;border-radius:20px;padding:17px;font-size:18px;font-weight:800;
    box-shadow:var(--shadow-sm);
  }
  .again{background:var(--accent);color:#fff;}
  .home-btn{background:var(--card);color:var(--ink);}

  .shake{animation:shake .4s;}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bounce{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(.3);opacity:0}}
  .flystar{position:fixed;font-size:30px;pointer-events:none;z-index:50;animation:fly .6s ease forwards;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;}
  }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- Inhalte ---------------- */

// MATHE: Generator – erzeugt immer neue Zufallsaufgaben
function makeMathQuestions(n){
  const qs=[];
  const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  for(let i=0;i<n;i++){
    const type=rnd(0,2);
    let a,b,text,answer;
    if(type===0){ // Einmaleins
      a=rnd(2,10); b=rnd(2,10); text=a+" × "+b; answer=a*b;
    }else if(type===1){ // Plus bis 200
      a=rnd(10,150); b=rnd(10,200-a); text=a+" + "+b; answer=a+b;
    }else{ // Minus bis 200, kein negatives Ergebnis
      a=rnd(50,200); b=rnd(10,a); text=a+" − "+b; answer=a-b;
    }
    qs.push({kind:"num",text:text,answer:String(answer)});
  }
  return qs;
}

    storiesFooter:"Wähl ein Abenteuer aus 📜",
    calcLabel:"Rechne aus", taskLabel:"Aufgabe", nextBtn:"Weiter ›",
    cheers:["Super!","Klasse!","Genau richtig!","Toll gemacht!","Stark!"],
    wrongNum:"Fast! Schau nochmal genau hin.", wrongChoice:"Nicht ganz – probier eine andere.",
    donePerfect:"Perfekt!", doneGood:"Gut gemacht!", doneSub:"Du hast diese Runde geschafft.",
    starsOf:(a,b)=>`⭐ ${a} von ${b} Sternen`, again:"Nochmal", subjectsBtn:"Fächer",
    stepCorrect:"Richtig! ✓", stepWrong:"Nicht ganz – versuch's nochmal.",
    storyDoneTitle:"Geschafft!", storyDoneSub:"Du hast das ganze Abenteuer gelöst.", otherStory:"Andere Geschichte",
    deutschPrompt:"Welches Wort ist richtig geschrieben?"
  },
  es:{
    welcome:"¡Bienvenida de nuevo!", subtitle:"Elige una materia y ¡empieza! ✨",
    historyBtn:"🕘 Ver historial", footerHome:"Aplicación · Ejercicios de 3er grado",
    historyTitle:"🕘 Historial", historyFooter:"Esto es todo por ahora – ¡sigue creciendo! 🌱",
    storiesTitle:"Historias", storiesSub:"3 pasos para resolver",
    storiesFooter:"Elige una aventura 📜",
    calcLabel:"Calcula", taskLabel:"Actividad", nextBtn:"Seguir ›",
    cheers:["¡Genial!","¡Súper!","¡Exacto!","¡Bien hecho!","¡Fuerte!"],
    wrongNum:"¡Casi! Mira otra vez con calma.", wrongChoice:"No del todo – prueba otra.",
    donePerfect:"¡Perfecto!", doneGood:"¡Bien hecho!", doneSub:"Terminaste esta ronda.",
    starsOf:(a,b)=>`⭐ ${a} de ${b} estrellas`, again:"Otra vez", subjectsBtn:"Materias",
    stepCorrect:"¡Correcto! ✓", stepWrong:"No del todo – inténtalo de nuevo.",
    storyDoneTitle:"¡Lo lograste!", storyDoneSub:"Resolviste toda la aventura.", otherStory:"Otra historia",
    deutschPrompt:"¿Cuál palabra en alemán está bien escrita?"
  }
};
function t(key){ return UI[LANG][key]; }
function langToggleHTML(){
  return `<div class="lang-toggle">
    <button class="lang-btn ${LANG==='de'?'active':''}" onclick="setLang('de')">🇩🇪 DE</button>
    <button class="lang-btn ${LANG==='es'?'active':''}" onclick="setLang('es')">🇪🇸 ES</button>
  </div>`;
}
function setLang(l){ LANG=l; renderHome(); }

/* ---------------- Ablauf ---------------- */
const SUBJECT_META={
  mathe:{emoji:"➕",accent:"var(--mathe)",count:8,
    name:{de:"Mathe",es:"Matemáticas"}, tag:{de:"Rechnen bis 200 & Einmaleins",es:"Cálculo hasta 200 y tablas"}},
  deutsch:{emoji:"📖",accent:"var(--deutsch)",count:8,
    name:{de:"Deutsch",es:"Alemán"}, tag:{de:"Richtig schreiben",es:"Ortografía alemana"}},
  sach:{emoji:"🌍",accent:"var(--sach)",count:8,
    name:{de:"Sachunterricht",es:"Ciencias"}, tag:{de:"Warum ist das so?",es:"¿Por qué es así?"}},
  text:{emoji:"📖",accent:"var(--text)",count:8,
    name:{de:"Textaufgaben",es:"Problemas"}, tag:{de:"Knifflige Sachaufgaben",es:"Problemas para pensar"}}
};
const STORY_META={emoji:"📜",accent:"#D98C3D",
  name:{de:"Geschichten",es:"Historias"}, tag:{de:"Große Rechen-Abenteuer in 3 Schritten",es:"Grandes aventuras matemáticas en 3 pasos"}};

const app=document.getElementById("app");
let state=null;

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildQuestions(sub){
  if(sub==="mathe") return makeMathQuestions(SUBJECT_META.mathe.count);
  if(sub==="text"){
    const pool = LANG==='es'?TEXTAUFGABEN_ES:TEXTAUFGABEN_DE;
    return shuffle(pool).slice(0,SUBJECT_META.text.count).map(q=>({kind:"num",text:q.text,answer:String(q.answer)}));
  }
  if(sub==="deutsch"){
    return shuffle(DEUTSCH).slice(0,SUBJECT_META.deutsch.count).map(q=>{
      const correctText=q.opts[q.correct];
      const opts=shuffle(q.opts);
      return {kind:"choice",text:t("deutschPrompt"),opts:opts,answer:correctText,why:null};
    });
  }
  const pool = LANG==='es'?SACH_ES:SACH_DE;
  return shuffle(pool).slice(0,SUBJECT_META.sach.count).map(q=>{
    // Antwortoptionen mischen, richtige Antwort mitverfolgen
    const correctText=q.opts[q.correct];
    const opts=shuffle(q.opts);
    return {kind:"choice",text:q.text,opts:opts,answer:correctText,why:q.why||null};
  });
}

/* ---- HOME ---- */
function renderHome(){
  state=null;
  document.documentElement.style.setProperty('--accent','var(--mathe)');
  app.innerHTML=`
    ${langToggleHTML()}
    <div class="home-head">
      <div class="hi">${t("welcome")}</div>
      <h1>Lernwelt</h1>
      <div class="sub">${t("subtitle")}</div>
    </div>
    <div class="cards">
      ${Object.entries(SUBJECT_META).map(([k,s])=>`
        <button class="card" style="--c:${s.accent}" onclick="startSubject('${k}')">
          <span class="emoji">${s.emoji}</span>
          <span class="txt"><h2>${s.name[LANG]}</h2><p>${s.tag[LANG]}</p></span>
          <span class="go">›</span>
        </button>`).join("")}
      <button class="card" style="--c:${STORY_META.accent}" onclick="startStories()">
        <span class="emoji">${STORY_META.emoji}</span>
        <span class="txt"><h2>${STORY_META.name[LANG]}</h2><p>${STORY_META.tag[LANG]}</p></span>
        <span class="go">›</span>
      </button>
    </div>
    <button class="hist-btn" onclick="renderHistory()">${t("historyBtn")}</button>
    <div class="foot">${t("footerHome")}</div>`;
}

/* ---- Verlaufs-Seite ---- */
function renderHistory(){
  document.documentElement.style.setProperty('--accent','var(--mathe)');
  const list = LANG==='es'?CHANGELOG_ES:CHANGELOG_DE;
  const items=list.slice().reverse(); // neueste zuerst
  app.innerHTML=`
    <div class="top">
      <button class="back" onclick="renderHome()">‹</button>
      <span class="name">${t("historyTitle")}</span>
    </div>
    <div class="hist-list">
      ${items.map(it=>`
        <div class="hist-item">
          <div class="d">${it.date}</div>
          <div class="t">${it.text}</div>
        </div>`).join("")}
    </div>
    <div class="foot">${t("historyFooter")}</div>`;
}

/* ---- Geschichten: Auswahl ---- */
function startStories(){
  document.documentElement.style.setProperty('--accent',STORY_META.accent);
  const list = LANG==='es'?STORIES_ES:STORIES_DE;
  app.innerHTML=`
    <div class="top">
      <button class="back" onclick="renderHome()">‹</button>
      <span class="name">${STORY_META.emoji} ${t("storiesTitle")}</span>
    </div>
    <div class="cards">
      ${list.map((s,i)=>`
        <button class="card" style="--c:${STORY_META.accent}" onclick="openStory(${i})">
          <span class="emoji">${s.emoji}</span>
          <span class="txt"><h2>${s.title}</h2><p>${t("storiesSub")}</p></span>
          <span class="go">›</span>
        </button>`).join("")}
    </div>
    <div class="foot">${t("storiesFooter")}</div>`;
}

/* ---- Geschichte spielen ---- */
let storyState=null;
function openStory(i){
  storyState={idx:i,step:0,done:[false,false,false]};
  renderStory();
}
function renderStory(){
  const list = LANG==='es'?STORIES_ES:STORIES_DE;
  const s=list[storyState.idx];
  app.innerHTML=`
    <div class="top">
      <button class="back" onclick="startStories()">‹</button>
      <span class="name">${s.emoji} ${s.title}</span>
    </div>
    <div class="story-card">
      <span class="story-emoji">${s.emoji}</span>
      <div class="story-text">${s.text}</div>
      <div class="steps">
        ${s.steps.map((st,i)=>`
          <div class="step ${i>storyState.step?'locked':''}" id="step${i}">
            <div class="slabel">${st.label}</div>
            <div class="stext">${st.q}</div>
            <div class="srow">
              <input type="number" inputmode="numeric" id="inp${i}" ${i>storyState.step?'disabled':''} placeholder="?">
              <button class="chk" ${i>storyState.step?'disabled style="opacity:.3"':''} onclick="checkStep(${i})">✓</button>
            </div>
            <div class="stepfb" id="fb${i}"></div>
          </div>`).join("")}
      </div>
    </div>`;
}
function checkStep(i){
  const list = LANG==='es'?STORIES_ES:STORIES_DE;
  const s=list[storyState.idx], st=s.steps[i];
  const inp=document.getElementById("inp"+i);
  const val=inp.value.trim();
  const stepEl=document.getElementById("step"+i);
  const fb=document.getElementById("fb"+i);
  if(val===""||isNaN(val)) return;
  if(parseInt(val,10)===st.a){
    stepEl.classList.add("correct");
    inp.disabled=true;
    fb.className="stepfb show ok"; fb.textContent=t("stepCorrect");
    if(i===s.steps.length-1){
      setTimeout(()=>storyDone(),700);
    }else{
      storyState.step=i+1;
      setTimeout(renderStory,500);
    }
  }else{
    stepEl.classList.add("wrong");
    fb.className="stepfb show no"; fb.textContent=t("stepWrong");
    setTimeout(()=>stepEl.classList.remove("wrong"),600);
  }
}
function storyDone(){
  const list = LANG==='es'?STORIES_ES:STORIES_DE;
  const s=list[storyState.idx];
  app.innerHTML=`
    <div class="top">
      <button class="back" onclick="startStories()">‹</button>
      <span class="name">${s.emoji} ${s.title}</span>
    </div>
    <div class="done">
      <div class="burst">🏆</div>
      <h2>${t("storyDoneTitle")}</h2>
      <p>${t("storyDoneSub")}</p>
      <div class="row">
        <button class="again" onclick="openStory(${storyState.idx})">${t("again")}</button>
        <button class="home-btn" onclick="startStories()">${t("otherStory")}</button>
      </div>
    </div>`;
}

/* ---- QUIZ starten ---- */
function startSubject(sub){
  const meta={emoji:SUBJECT_META[sub].emoji, name:SUBJECT_META[sub].name[LANG], accent:SUBJECT_META[sub].accent};
  document.documentElement.style.setProperty('--accent',meta.accent);
  state={sub:sub,meta:meta,questions:buildQuestions(sub),idx:0,stars:0,input:"",answered:false};
  renderQuestion();
}

function renderQuestion(){
  const s=state, q=s.questions[s.idx];
  const dots=s.questions.map((_,i)=>`<i class="${i<s.idx?'done':(i===s.idx?'now':'')}"></i>`).join("");
  let body="";
  if(q.kind==="num"){
    body=`
      <div class="display" id="disp"><span class="ph">?</span></div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="tap('${n}')">${n}</button>`).join("")}
        <button class="key" onclick="del()">⌫</button>
        <button class="key" onclick="tap('0')">0</button>
        <button class="key act" onclick="checkNum()">✓</button>
      </div>`;
  }else{
    body=`<div class="opts" id="opts">
      ${q.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})">${o}</button>`).join("")}
    </div>`;
  }
  app.innerHTML=`
    <div class="top">
      <button class="back" onclick="renderHome()">‹</button>
      <span class="name">${s.meta.emoji} ${s.meta.name}</span>
      <span class="stars"><span class="s">⭐</span><span id="starnum">${s.stars}</span></span>
    </div>
    <div class="dots">${dots}</div>
    <div class="q-card">
      <div class="q-label">${q.kind==='num'?t("calcLabel"):t("taskLabel")+' '+(s.idx+1)}</div>
      <div class="q-text ${q.text.length>34?'small':''}">${q.text}</div>
    </div>
    ${body}
    <div class="fb" id="fb"></div>
    <button class="next" id="next" onclick="nextQ()">${t("nextBtn")}</button>`;
  s.input=""; s.answered=false;
}

/* ---- Zahlen-Eingabe ---- */
function tap(n){
  if(state.answered) return;
  if(state.input.length>=4) return;
  state.input+=n;
  updateDisp();
}
function del(){ if(state.answered) return; state.input=state.input.slice(0,-1); updateDisp(); }
function updateDisp(){
  const d=document.getElementById("disp");
  d.className="display";
  d.innerHTML=state.input===""?'<span class="ph">?</span>':state.input;
}
function checkNum(){
  const s=state; if(s.answered||s.input==="") return;
  const q=s.questions[s.idx];
  const d=document.getElementById("disp");
  if(s.input===q.answer){
    d.classList.add("correct"); s.answered=true;
    award(); showFB(true,null); showNext();
  }else{
    d.classList.add("wrong"); d.classList.add("shake");
    setTimeout(()=>{d.classList.remove("wrong","shake"); s.input=""; updateDisp();},650);
    flash(t("wrongNum"));
  }
}

/* ---- Auswahl-Eingabe ---- */
function pick(i){
  const s=state; if(s.answered) return;
  const q=s.questions[s.idx];
  const btns=document.querySelectorAll("#opts .opt");
  const chosen=q.opts[i];
  if(chosen===q.answer){
    s.answered=true;
    btns.forEach((b,j)=>{ if(q.opts[j]!==q.answer) b.classList.add("dim"); });
    btns[i].classList.add("correct");
    award(); showFB(true,q.why); showNext();
  }else{
    btns[i].classList.add("wrong"); btns[i].classList.add("shake");
    setTimeout(()=>btns[i].classList.remove("shake"),450);
    flash(t("wrongChoice"));
  }
}

/* ---- Feedback / Sterne / Weiter ---- */
function award(){
  state.stars++;
  const num=document.getElementById("starnum");
  num.textContent=state.stars;
  flyStar();
}
function flyStar(){
  const target=document.querySelector(".stars");
  if(!target) return;
  const r=target.getBoundingClientRect();
  const st=document.createElement("div");
  st.className="flystar"; st.textContent="⭐";
  st.style.left=(window.innerWidth/2-15)+"px";
  st.style.top=(window.innerHeight/2)+"px";
  st.style.setProperty("--fx",(r.left-window.innerWidth/2+15)+"px");
  st.style.setProperty("--fy",(r.top-window.innerHeight/2)+"px");
  document.body.appendChild(st);
  setTimeout(()=>st.remove(),650);
}
function showFB(ok,why){
  const fb=document.getElementById("fb");
  fb.className="fb show "+(ok?"ok":"no");
  const cheers=t("cheers");
  const msg=ok?cheers[Math.floor(Math.random()*cheers.length)]:"";
  fb.innerHTML=`<span class="big">${ok?'🎉':'🤔'}</span><span>${msg}${why?`<span class="why">${why}</span>`:""}</span>`;
}
function flash(text){ // kurzer Hinweis bei falscher Antwort
  const fb=document.getElementById("fb");
  fb.className="fb show no";
  fb.innerHTML=`<span class="big">🙂</span><span>${text}</span>`;
  clearTimeout(window._ft);
  window._ft=setTimeout(()=>{ if(!state.answered) fb.className="fb"; },1400);
}
function showNext(){ document.getElementById("next").classList.add("show"); }

function nextQ(){
  state.idx++;
  if(state.idx>=state.questions.length) renderDone();
  else renderQuestion();
}

/* ---- Abschluss ---- */
function renderDone(){
  const s=state, total=s.questions.length;
  const perfect=s.stars>=total;
  app.innerHTML=`
    <div class="top">
      <button class="back" onclick="renderHome()">‹</button>
      <span class="name">${s.meta.emoji} ${s.meta.name}</span>
    </div>
    <div class="done">
      <div class="burst">${perfect?'🏆':'🌟'}</div>
      <h2>${perfect?t("donePerfect"):t("doneGood")}</h2>
      <p>${t("doneSub")}</p>
      <div class="tally">${t("starsOf")(s.stars,total)}</div>
      <div class="row">
        <button class="again" onclick="startSubject('${s.sub}')">${t("again")}</button>
        <button class="home-btn" onclick="renderHome()">${t("subjectsBtn")}</button>
      </div>
    </div>`;
}

renderHome();
</script>
</body>
</html>
